- name: Prepare Docker
  hosts:
  - opensdn_role_vrouter
  - opensdn_role_compute_legacy
  gather_facts: yes
  roles:
    - docker
  vars_files:
    - "{{ hostvars['localhost'].config_file }}"
  tags: infrastructure

- name: Set compose version
  hosts:
  - opensdn_role_vrouter
  - opensdn_role_compute_legacy
  gather_facts: no
  tasks:
  - include_role:
      name: compose
      tasks_from: "init"
  tags: always

- name: ZIU stage 0 configure and update images
  ansible.builtin.import_playbook: ziu_compute_update_images.yml

- name: ZIU stage 1 restart services
  ansible.builtin.import_playbook: ziu_compute_restart.yml
