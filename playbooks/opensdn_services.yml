- name: Set compose version
  hosts: container_hosts
  gather_facts: no
  roles:
    - compose
  tags: always


- name: Remove opensdn from Deleted Nodes ( Deregister )
  hosts: "{{ deleted_nodes_dict.values() }}"
  gather_facts: yes
  tasks:
  - ansible.builtin.include_role:
      name: opensdn
      tasks_from: deregister
    vars:
      instance_data: "{{ instances[hostvars[inventory_hostname].instance_name] }}"
      instance_name: "{{ hostvars[inventory_hostname].instance_name }}"
      ip_address: "{{ inventory_hostname }}"
    when:
      - global_configuration.ENABLE_DESTROY | default('True') | bool
      - api_server is defined

- name: Remove opensdn from Deleted Nodes ( Cleanup )
  hosts:  "{{ deleted_nodes_dict.values() }}"
  tasks:
  - ansible.builtin.include_role:
      name: opensdn
      tasks_from: delete
    vars:
      instance_data: "{{ instances[hostvars[inventory_hostname].instance_name] }}"
      instance_name: "{{ hostvars[inventory_hostname].instance_name }}"
    when:
      - global_configuration.ENABLE_DESTROY | default('True') | bool
      - deleted_nodes_dict.keys() | length > 0
      - inventory_hostname in deleted_nodes_dict.values()
  - name: Cleanup Node
    ansible.builtin.include_role:
      name: destroy
    vars:
      instance_data: "{{ instances[hostvars[inventory_hostname].instance_name] }}"
      instance_name: "{{ hostvars[inventory_hostname].instance_name }}"
    when:
      - global_configuration.ENABLE_DESTROY | default('True') | bool
      - deleted_nodes_dict.keys() | length > 0
      - inventory_hostname in deleted_nodes_dict.values()


