- name: Prepare Docker
  hosts:
  - opensdn_role_analytics
  - opensdn_role_analytics_alarm
  - opensdn_role_analytics_database
  - opensdn_role_analytics_snmp
  - opensdn_role_config
  - opensdn_role_config_database
  - opensdn_role_control
  - opensdn_role_control_only
  - opensdn_role_k8s_master
  - opensdn_role_k8s_node
  - opensdn_role_kubemanager
  - opensdn_role_toragent
  - opensdn_role_tsn_haproxy
  - opensdn_role_webui
  gather_facts: yes
  roles:
    - docker
  vars_files:
    - "{{ hostvars['localhost'].config_file }}"
  tags: infrastructure

- name: Set compose version
  hosts:
  - opensdn_role_analytics
  - opensdn_role_analytics_alarm
  - opensdn_role_analytics_database
  - opensdn_role_analytics_snmp
  - opensdn_role_config
  - opensdn_role_config_database
  - opensdn_role_control
  - opensdn_role_control_only
  - opensdn_role_k8s_master
  - opensdn_role_k8s_node
  - opensdn_role_kubemanager
  - opensdn_role_toragent
  - opensdn_role_tsn_haproxy
  - opensdn_role_webui
  gather_facts: no
  tasks:
  - include_role:
      name: compose
      tasks_from: "init"
  tags: always

- name: ZIU stage 0 configure and update images
  ansible.builtin.import_playbook: ziu_controller_update_images.yml

- name: ZIU stage 1 stop services
  ansible.builtin.import_playbook: ziu_controller_services_stop.yml

- name: ZIU stage 2 start services
  ansible.builtin.import_playbook: ziu_controller_services_start.yml

- name: ZIU stage 3 stop and start control sequently
  ansible.builtin.import_playbook: ziu_controller_control_restart.yml

- name: ZIU stage 4 stop and start databases sequently
  ansible.builtin.import_playbook: ziu_controller_databases_restart.yml
