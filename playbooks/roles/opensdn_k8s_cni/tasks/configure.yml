- name: create /etc/contrail/cni
  file:
    path: /etc/contrail/cni
    state: directory
    recurse: yes

- name: "prepare configuration"
  set_fact:
    config_content: |
      {% for key, value in (
        contrail_configuration | default({}) | ansible.builtin.combine(
          instances[instance_name].contrail_configuration | default({}),
          sdn_roles[instance_name].k8s_master | default({})
        )
      ).items() %}
      {{ key }}={{ value }}
      {% endfor %}

- name: "create /etc/contrail/common_cni.env"
  copy:
    content: "{{ config_content }}"
    dest: "/etc/contrail/common_cni.env"
    mode: "0640"

- name: create /var/lib/contrail
  file:
    path: /var/lib/contrail
    state: directory
    recurse: yes

- name: create /etc/cni
  file:
    path: /etc/cni
    state: directory
    recurse: yes

- name: create /opt/cni/bin
  file:
    path: /opt/cni/bin
    state: directory
    recurse: yes

- name: create /var/log/contrail/cni
  file:
    path: /var/log/contrail/cni
    state: directory
    recurse: yes

- name: "create cni compose file"
  template:
    src: contrail-cni.yaml.j2
    dest: "/etc/contrail/cni/docker-compose.yaml"
