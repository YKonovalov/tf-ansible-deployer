- name: "update kubemanager_{{ contrail_configuration.get('KUBERNETES_CLUSTER_NAME', 'k8s') }} images"
  include_role:
    name: "compose_pull_v{{ compose_version }}"
  vars:
    compose_name: "kubemanager_{{ contrail_configuration.get('KUBERNETES_CLUSTER_NAME', 'k8s') }}"
  when:
    - contrail_configuration.UPDATE_IMAGES is undefined or contrail_configuration.UPDATE_IMAGES != false
