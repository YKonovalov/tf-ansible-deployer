    webui_nodes_list: "{{ filtered | map(attribute='value.private_ip') | default( filtered | map(attribute='value.ip')) | list }}"
  when:
    - contrail_configuration.CONTROLLER_NODES is not defined
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.webui', 'defined') }}"

- name: define k8s_master nodes list
  set_fact:
    k8s_master_nodes_list: "{{ filtered | map(attribute='value.private_ip') | default( filtered | map(attribute='value.ip')) | list }}"
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.k8s_master', 'defined') }}"

- name: define k8s_node nodes list
  set_fact:
    k8s_node_nodes_list: "{{ filtered | map(attribute='value.private_ip') | default( filtered | map(attribute='value.ip')) | list }}"
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.k8s_node', 'defined') }}"

