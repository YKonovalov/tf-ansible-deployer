---
- set_fact:
    config_nodes_list: []
    control_nodes_list: []
    control_nodes_pods: {}
    configdb_nodes_list: []
    analytics_nodes_list: []
    analytics_snmp_nodes_list: []
    analytics_alarm_nodes_list: []
    analyticsdb_nodes_list: []
    webui_nodes_list: []
    k8s_master_nodes_list: []
    k8s_node_nodes_list: []
    kubemanager_nodes_list: []
    openstack_nodes_list: []
    vrouter_nodes_list: []
    tsn_nodes_list: []
    locations_control_nodes: {}

- name: define config nodes list
  set_fact:
    config_nodes_list: "{{ filtered | map(attribute='value.private_ip') | default( filtered | map(attribute='value.ip')) | list }}"
  when:
    - contrail_configuration.CONTROLLER_NODES is not defined
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.config', 'defined') }}"


- name: define control nodes list
  set_fact:
    control_nodes_list: "{{ filtered | map(attribute='value.private_ip') | default( filtered | map(attribute='value.ip')) | list }}"
  when:
    - contrail_configuration.CONTROLLER_NODES is not defined
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.control', 'defined') }}"

- name: define configdb nodes list
  set_fact:
    configdb_nodes_list: "{{ filtered | map(attribute='value.private_ip') | default( filtered | map(attribute='value.ip')) | list }}"
  when:
    - contrail_configuration.CONTROLLER_NODES is not defined
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.config_database', 'defined') }}"

