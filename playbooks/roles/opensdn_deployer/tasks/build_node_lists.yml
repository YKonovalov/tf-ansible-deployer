  set_fact:
    kubemanager_nodes_list: "{{ filtered | map(attribute='value.private_ip') | default( filtered | map(attribute='value.ip')) | list }}"
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.kubemanager', 'defined') }}"

- name: define openstack nodes list
  set_fact:
    openstack_nodes_list: "{{ filtered | map(attribute='value.private_ip') | default( filtered | map(attribute='value.ip')) | list }}"
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.openstack', 'defined') }}"

- name: define Vrouter nodes list
  set_fact:
    vrouter_nodes_list: "{{ filtered | map(attribute='value.private_ip') | default( filtered | map(attribute='value.ip')) | list }}"
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.vrouter', 'defined') }}"

- name: define TSN nodes list
  set_fact:
    tsn_nodes_list: "{{ filtered | map(attribute='value.private_ip') | default( filtered | map(attribute='value.ip')) | list }}"
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.vrouter.TSN_EVPN_MODE', 'defined') | selectattr('value.roles.vrouter.TSN_EVPN_MODE', 'equalto', true) }}"

- name: define control nodes list for remote locations
  set_fact:
    locations_control_nodes: "{{ locations_control_nodes | default({}) | combine(
                              {
                               (item.value.roles.control.location|default('')): 
                               (locations_control_nodes[item.value.roles.control.location|default('')] | default([])) +
                               [item.value.private_ip | default(item.value.ip)]
                              }
                            )
                         }}"
  loop: "{{ instances | dict2items | selectattr('value.roles.control', 'defined') }}"

- name: OpenSDN nodes summary
  debug:
    msg:
      config_nodes_list: "{{ config_nodes_list }}"
      control_nodes_list: "{{ control_nodes_list }}"
      configdb_nodes_list: "{{ configdb_nodes_list }}"
      analytics_nodes_list: "{{ analytics_nodes_list }}"
      analytics_snmp_nodes_list: "{{ analytics_snmp_nodes_list }}"
      analytics_alarm_nodes_list: "{{ analytics_alarm_nodes_list }}"
      analyticsdb_nodes_list: "{{ analyticsdb_nodes_list }}"
      webui_nodes_list: "{{ webui_nodes_list }}"
      k8s_master_nodes_list: "{{ k8s_master_nodes_list }}"
      k8s_node_nodes_list: "{{ k8s_node_nodes_list }}"
      kubemanager_nodes_list: "{{ kubemanager_nodes_list }}"
      openstack_nodes_list: "{{ openstack_nodes_list }}"
      vrouter_nodes_list: "{{ vrouter_nodes_list }}"
      tsn_nodes_list: "{{ tsn_nodes_list }}"
      locations_control_nodes: "{{ locations_control_nodes }}"
