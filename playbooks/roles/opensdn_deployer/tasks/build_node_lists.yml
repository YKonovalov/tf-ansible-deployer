  when:
    - contrail_configuration.CONTROLLER_NODES is not defined
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.analytics_alarm', 'defined') }}"

- name: define analyticsdb nodes list
  set_fact:
    analyticsdb_nodes_list: "{{ filtered | map(attribute='value.private_ip') | default( filtered | map(attribute='value.ip')) | list }}"
  when:
    - contrail_configuration.CONTROLLER_NODES is not defined
  vars:
    filtered: "{{ instances | dict2items | selectattr('value.roles.analytics_database', 'defined') }}"

