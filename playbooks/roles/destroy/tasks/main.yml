---
- name: find all directories
  find:
    path: /etc/contrail
    file_type: directory
  register: dir_out

- name: skip invalid dir which doesn't have compose file
  stat:
    path: "{{ item.path }}/docker-compose.yaml"
  register: rc
  with_items: "{{ dir_out.files }}"


- include_role:
    name: compose
  vars:
    compose_name: "{{ item.item.path.split('/')[3] }}"
    compose_src:  "{{ item.item.path }}"
    compose_state: absent
    compose_remove_images: all
    compose_remove_volumes: yes
  with_items: "{{ rc.results }}"
  when: item.stat.exists == true
