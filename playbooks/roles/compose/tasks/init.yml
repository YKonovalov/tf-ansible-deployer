- name: "docker_compose_v2 support check ansible"
  set_fact:
      compose_v2_ansible: true
  when:
  - "'community.docker.docker_compose_v2' is community.general.a_module"
  ignore_errors: yes

- name: "docker_compose_v2 support check cli"
  command: docker compose
  register: compose_v2_cli
  failed_when: compose_v2_cli.rc not in [0, 1]
  changed_when: false

- name: docker_compose set version
  set_fact:
      compose_version: "{{ '2' if compose_v2_ansible|default(false) and compose_v2_cli.rc|default(1) == 0 else '1' }}"
